name: Deploy to Google Play

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: CI
    timeout-minutes: 30
    env:
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
      MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          for secret_name in \
            MAPBOX_DOWNLOADS_TOKEN \
            MAPBOX_PUBLIC_TOKEN \
            KEYSTORE_BASE64 \
            KEYSTORE_STORE_PASSWORD \
            KEYSTORE_KEY_ALIAS \
            KEYSTORE_KEY_PASSWORD \
            GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Configure $secret_name as a GitHub Actions secret."
              exit 1
            fi
          done

      - name: Create Mapbox public token resource
        run: |
          mkdir -p app/src/main/res/values
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources xmlns:tools="http://schemas.android.com/tools">' \
            "    <string name=\"mapbox_access_token\" translatable=\"false\" tools:ignore=\"UnusedResources\">$MAPBOX_PUBLIC_TOKEN</string>" \
            '</resources>' \
            > app/src/main/res/values/mapbox_access_token.xml

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks

      - name: Write release signing properties
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_STORE_PASSWORD
          keyAlias=$KEYSTORE_KEY_ALIAS
          keyPassword=$KEYSTORE_KEY_PASSWORD
          EOF

      - name: Build release AAB
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload to Google Play internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.gooludou.shadowplanner
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
