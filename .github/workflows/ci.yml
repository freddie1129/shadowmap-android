name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    environment: CI
    timeout-minutes: 30
    env:
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
      MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Mapbox credentials
        run: |
          if [[ -z "$MAPBOX_DOWNLOADS_TOKEN" || -z "$MAPBOX_PUBLIC_TOKEN" ]]; then
            echo "Configure MAPBOX_DOWNLOADS_TOKEN and MAPBOX_PUBLIC_TOKEN as repository secrets."
            exit 1
          fi

      - name: Create Mapbox public token resource
        run: |
          mkdir -p app/src/main/res/values
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources xmlns:tools="http://schemas.android.com/tools">' \
            "    <string name=\"mapbox_access_token\" translatable=\"false\" tools:ignore=\"UnusedResources\">$MAPBOX_PUBLIC_TOKEN</string>" \
            '</resources>' \
            > app/src/main/res/values/mapbox_access_token.xml

      - name: Run quality checks
        run: ./gradlew qualityCheck --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
